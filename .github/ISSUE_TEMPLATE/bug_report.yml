name: Bug report
description: Report a reproducible defect using privacy-safe evidence.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Use synthetic SSIDs, BSSIDs, IP addresses, timestamps, and screenshots. Report vulnerabilities through a private security advisory instead.
  - type: input
    id: commit
    attributes:
      label: Affected version or commit
      placeholder: v0.1.0 or a commit identifier
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device class
      description: Do not include serial numbers or other unique device identifiers.
      placeholder: Android 16, mid-range phone
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Permission state
      options:
        - Required permissions granted
        - A required permission denied
        - System Location off
        - Wi-Fi off
        - Unknown or not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproduction using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional privacy-safe evidence
      description: Redact all network and device identifiers before attaching logs or images.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real network identifiers, credentials, device identifiers, raw dumps, and unredacted screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
